name: Quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, and build
        run: npm run check

      - name: Install browser dependencies
        run: npx playwright install-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e:ci

      - name: Lighthouse budgets
        run: npm run lighthouse:ci

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-quality-reports
          path: |
            playwright-report
            test-results
            .lighthouseci/reports
          if-no-files-found: ignore
          retention-days: 14
